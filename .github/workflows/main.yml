name: Build TearedTune V3 VST3 (Windows x64)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tearedtune-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 VST3
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Find project and configure Release build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkoutRoot = $PWD.Path
          $projectDir = $checkoutRoot
          $rootCmake = Join-Path $projectDir 'CMakeLists.txt'

          if (-not (Test-Path -LiteralPath $rootCmake -PathType Leaf)) {
            $cmakeFile = Get-ChildItem -LiteralPath $checkoutRoot -Recurse -File -Filter 'CMakeLists.txt' |
              Where-Object { $_.FullName -notmatch '[\\/](\.git|build|dist|_deps)[\\/]' } |
              Select-Object -First 1
            if (-not $cmakeFile) {
              Get-ChildItem -LiteralPath $checkoutRoot -Force | Select-Object Name, Mode
              throw 'No CMakeLists.txt was found in the checked-out repository.'
            }
            $projectDir = $cmakeFile.Directory.FullName
          }

          "Using project source: $projectDir"
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cmake -S "$projectDir" -B "$checkoutRoot/build" -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target TearedTune_VST3 --parallel

      - name: Package VST3 install folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vst = Get-ChildItem -Path 'build' -Recurse -Directory -Filter 'TearedTune V3.vst3' |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $vst) {
            throw 'Could not find the Release TearedTune V3.vst3 bundle after the build.'
          }

          $installReadme = Join-Path $env:PROJECT_DIR 'installer/README_INSTALL.txt'
          if (-not (Test-Path -LiteralPath $installReadme -PathType Leaf)) {
            throw "Required install guide was not found: $installReadme"
          }

          $stage = Join-Path $PWD 'dist/TearedTune-V3-VST3-Install'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $vst.FullName -Destination $stage -Recurse -Force
          Copy-Item -LiteralPath $installReadme -Destination $stage -Force
          Get-ChildItem -LiteralPath $stage -Force | Select-Object Name, Length

      - name: Upload downloadable VST3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TearedTune-V3-VST3-Install
          path: dist/TearedTune-V3-VST3-Install/
          if-no-files-found: error
          retention-days: 30
